name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run build
      - run: npm --prefix backend test
      - run: npm --prefix backend run test:e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
        env:
          NEXT_EXPORT: '1'
          NEXT_PUBLIC_API_URL: /api

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run app:typecheck
      - run: npm run app:test
      # O bundle Android (Hermes) precisa compilar: pega erro de importação dos módulos nativos.
      - run: npx expo export --platform android --output-dir /tmp/dist-android
        working-directory: apps/app
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - run: npm run app:e2e
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/app/test-results
